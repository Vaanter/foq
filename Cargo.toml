[package]
name = "foq"
version = "0.7.5"
authors = ["Valentín Bolfík"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
async-channel = "2.5.0"
async-trait = "0.1.89"
chrono = "0.4.45"
config = { version = "0.15.25", features = ["toml"] }
derive_builder = "0.20.2"
dyn-clone = "1.0.20"
futures = "0.3.32"
once_cell = "1.21.4"
path-clean = "1.0.1"
quinn =  "0.11.11"
regex = "1.13.0"
rustls = { version = "0.23.42", default-features = false, features = ["aws_lc_rs"]}
rustls-pemfile = "2.2.0"
s2n-quic = { version = "1.83.0", default-features = true, features = ["provider-tls-rustls", "provider-event-tracing", "zeroize"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full", "tracing"] }
tokio-rustls = "0.26.4"
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-attributes = "0.1.31"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-segmentation = "1.13.3"
walkdir = "2.5.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
blake3 = "1.8.5"
uuid = { version = "1.23.5", features = ["v4"] }

[profile.dev.package.sqlx-macros]
opt-level = 3

[target.'aarch64-linux-android'.dependencies]
aws-lc-rs = { version = "1.17.1", features = ["bindgen"]}
